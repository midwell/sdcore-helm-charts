{{- if .Values.config.smf.deploy }}

{{- if not .Values.config.useExistingConfigMap -}}
{{- $smfcfg := index .Values.config.smf.cfgFiles "smfcfg.yaml" }}
{{- $sbi := index $smfcfg.configuration "sbi" }}

{{- if not (hasKey $smfcfg.configuration "mongodb") -}}
{{- $_ := dict "name" .Values.config.mongodb.name "url" .Values.config.mongodb.url | set $smfcfg.configuration "mongodb" -}}
{{- end }}

{{/*
Refuse an unusable Lawful Interception timer before anything is deployed. See
_li-duration.tpl for why this belongs here as well as in the element.

Gated on li.enabled, because a value that is not read cannot be wrong: a deployment with
interception off and a stale timer left in its values must not be refused for a setting
that reaches no element.
*/}}
{{- if .Values.config.smf.li.enabled -}}
{{- range $key, $value := dict
      "keepaliveTimeout" .Values.config.smf.li.keepaliveTimeout
      "x2x3KeepaliveTimeP1" .Values.config.smf.li.x2x3KeepaliveTimeP1
      "x2x3KeepaliveTimeP2" .Values.config.smf.li.x2x3KeepaliveTimeP2 -}}
{{- include "5g-control-plane.li.checkDuration" (dict "value" $value "key" (printf "config.smf.li.%s" $key)) -}}
{{- end -}}
{{- end }}

{{/*
And the same guards over a **hand-written** li block in cfgFiles.

`hasKey $smfcfg.configuration "li"` below is an escape hatch: an operator who writes the block
themselves gets it passed through verbatim, which is deliberate — it is how a deployment reaches
a setting this chart does not model. What was not deliberate is that it also skipped every guard
above, so exactly the operator most likely to have hand-written a value was the one whose value
was never checked.

The tri-state booleans are **refused** rather than coerced here, unlike the chart-built block:
this element's config is YAML and the block is passed through as the operator wrote it, so a
quoted "false" would still reach the element as a string and fail its decode. Coercing would mean
rewriting a block whose whole point is that it is not rewritten.
*/}}
{{- if hasKey $smfcfg.configuration "li" -}}
{{- $hand := index $smfcfg.configuration "li" -}}
{{- range $key := list "keepaliveTimeout" "x2x3KeepaliveTimeP1" "x2x3KeepaliveTimeP2" -}}
{{- if hasKey $hand $key -}}
{{- include "5g-control-plane.li.checkDuration" (dict "value" (index $hand $key) "key" (printf "config.smf.cfgFiles['smfcfg.yaml'].configuration.li.%s" $key)) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "x2x3KeepaliveEnabled" "deactivateAllTasks" "removeAllDestinations" -}}
{{- if hasKey $hand $key -}}
{{- $v := index $hand $key -}}
{{- if not (or (kindIs "bool" $v) (kindIs "invalid" $v)) -}}
{{- fail (printf "config.smf.cfgFiles['smfcfg.yaml'].configuration.li.%s: %v is not a boolean. This block is passed through as written, so a quoted value reaches the element as a string and fails its configuration decode — write true or false unquoted, or leave the key out to take the specification's default." $key $v) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end }}

{{/*
Lawful Interception. The credential paths follow the Secret mounted at certDir by
the deployment, and x1Listen matches the port the X1 Service exposes, so enabling
LI needs no second place to keep in step. Optional fields are set only when
configured: an empty admfUrl leaves NE-initiated fault reporting off, and an empty
admfId accepts any correctly-bound ADMF rather than a named one.

"Configured" is `or (kindIs "bool" $v) $v` rather than plain `$v`, because the last
two keys are booleans and `if $v` is false for `false` — an operator withholding
permission for a bulk operation would have had the key silently dropped, leaving the
element performing it. For every string key the two tests agree: an unset string is
empty, which is falsey and not of kind bool, so nothing already here moves.
*/}}
{{- if and .Values.config.smf.li.enabled (not (hasKey $smfcfg.configuration "li")) -}}
{{- $li := dict
      "x1Listen" (printf ":%v" .Values.config.smf.li.x1.port)
      "neId" .Values.config.smf.li.neId
      "cert" (printf "%s/tls.crt" .Values.config.smf.li.certDir)
      "key" (printf "%s/tls.key" .Values.config.smf.li.certDir)
      "caCert" (printf "%s/ca.crt" .Values.config.smf.li.certDir) -}}
{{- range $k, $v := dict "mdf2" .Values.config.smf.li.mdf2 "mdf3" .Values.config.smf.li.mdf3 "admfUrl" .Values.config.smf.li.admfUrl "admfId" .Values.config.smf.li.admfId "keepaliveTimeout" .Values.config.smf.li.keepaliveTimeout "x2x3KeepaliveTimeP1" .Values.config.smf.li.x2x3KeepaliveTimeP1 "x2x3KeepaliveTimeP2" .Values.config.smf.li.x2x3KeepaliveTimeP2 -}}
{{- if or (kindIs "bool" $v) $v -}}{{- $_ := $v | set $li $k -}}{{- end -}}
{{- end -}}
{{/*
The three tri-state booleans are handled apart from the sweep above, because for them
the operator's *spelling* has to be checked rather than only their presence. See
_li-tristate.tpl: an empty-string default invites a quoted replacement, a quoted
boolean is a YAML string, and a YAML string where the element declares a *bool fails
the whole configuration load — the network function crashlooping over a lawful
interception key, which is the one cost an LI mistake may never have.
*/}}
{{- range $k, $v := dict "x2x3KeepaliveEnabled" .Values.config.smf.li.x2x3KeepaliveEnabled "deactivateAllTasks" .Values.config.smf.li.deactivateAllTasks "removeAllDestinations" .Values.config.smf.li.removeAllDestinations -}}
{{- $b := include "5g-control-plane.li.triStateBool" (dict "value" $v "key" (printf "config.smf.li.%s" $k)) -}}
{{- if eq $b "true" -}}{{- $_ := set $li $k true -}}{{- end -}}
{{- if eq $b "false" -}}{{- $_ := set $li $k false -}}{{- end -}}
{{- end -}}
{{/*
The SMF is the CC Triggering Function: it tasks the CC-POI in each UPF over LI_T3,
so it needs that UPF's X1 endpoint and the identifier its certificate is bound to.
Neither can be derived — the identifier is not in the URL — so they are listed per
UPF, keyed by the N4 node address the SMF's PFCP context uses. Without an entry for
a UPF, content it duplicates cannot be attributed to a warrant and the SMF reports
a task issue to the LIPF instead.
*/}}
{{/*
Two triggering endpoints may not share an neId. The SMF refuses such a configuration
at startup, and it is refused here too so the mistake is caught while nothing is
deployed — the same reasoning as the duration and boolean checks.

The consequence is invisible from either UPF: each numbers its own product correctly.
Every UPF serving one session is deliberately given the same delivery identifier and
correlation value, so TS 103 221-2 clause 5.3.9's sequence context is separated only
by what follows from ne_id. Two sharing it number one context from zero independently,
and the mediation function sees duplicated numbers and apparent gaps — which is how
loss is signalled on this interface, for a warrant whose product is otherwise correct.
*/}}
{{- if .Values.config.smf.li.upfTriggers -}}
{{- $seenNEIDs := dict -}}
{{- range $i, $t := .Values.config.smf.li.upfTriggers -}}
{{/*
Each entry's three keys, checked before anything reads them. An entry missing one used to
fail on `hasKey $seenNEIDs $t.neId` with "wrong type for value; expected string; got
interface {}" — a message that names neither the key nor the list nor the entry, for a
mistake in a values file the operator has just edited. Every one of the three is required:
without neId the SMF cannot attribute the UPF's content to a warrant, without nodeId it
cannot find the entry for the UPF serving a session, and without x1Url it has nowhere to
send the trigger.
*/}}
{{- range $key := list "neId" "nodeId" "x1Url" -}}
{{- if not (index $t $key) -}}
{{- fail (printf "config.smf.li.upfTriggers[%d].%s is required: each entry names one UPF's point of interception (neId), the N4 node address the SMF's PFCP context uses for it (nodeId), and its LI_T3 triggering endpoint (x1Url). Entry as written: %v" $i $key $t) -}}
{{- end -}}
{{- end -}}
{{- if hasKey $seenNEIDs $t.neId -}}
{{- fail (printf "config.smf.li.upfTriggers: %q and %q share neId %q. Two points of interception with one element identifier number a single delivery context independently, which reaches the mediation function as duplicated sequence numbers and apparent loss." (index $seenNEIDs $t.neId) $t.nodeId $t.neId) -}}
{{- end -}}
{{- $_ := set $seenNEIDs $t.neId $t.nodeId -}}
{{- end -}}
{{- $_ := .Values.config.smf.li.upfTriggers | set $li "upfTriggers" -}}
{{- end -}}
{{- if and .Values.config.smf.li.upfTriggers (not .Values.config.smf.li.mdf3) -}}
{{- fail "config.smf.li.mdf3 is required when config.smf.li.upfTriggers is set: the triggering function provisions the X3 destination at each UPF, which carries no MDF3 address of its own" -}}
{{- end -}}
{{/*
Pre-shared delivery destinations, if any. A task naming one of these DIDs is delivered to
it exactly as if the ADMF had provisioned it with CreateDestination — which is a supported
arrangement, not a fallback: neither TS 103 221-1 nor TS 33.128 requires that a task's
destination identifier arrived over X1 rather than having been agreed. A destination
provisioned over X1 under the same DID takes precedence, and the element reports which is
in force. `mdf2` above remains the default for a task that names nothing resolvable.
*/}}
{{- if .Values.config.smf.li.destinations -}}
{{- $_ := .Values.config.smf.li.destinations | set $li "destinations" -}}
{{- end -}}
{{- $_ := $li | set $smfcfg.configuration "li" -}}
{{- end }}

{{- if not (hasKey $smfcfg "logger") -}}
{{- $_ := .Values.config.logger | set $smfcfg "logger" -}}
{{- end }}
{{- if not (hasKey $sbi "port") -}}
{{- $_ := .Values.config.smf.sbi.port | set $sbi "port" -}}
{{- end }}
{{- if not (hasKey $smfcfg.configuration "enableUPFAdapter") -}}
{{- $_ := .Values.config.upfadapter.deploy | set $smfcfg.configuration "enableUPFAdapter" -}}
{{- end }}
{{- if not (hasKey $smfcfg.configuration.kafkaInfo "enableKafka") -}}
{{- $_ := .Values.kafka.deploy | set $smfcfg.configuration.kafkaInfo "enableKafka" -}}
{{- end }}

{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smf
  labels:
{{ tuple "smf" . | include "5g-control-plane.metadata_labels" | indent 4 }}
data:
  smf-run.sh: |
{{ tuple "bin/_smf-run.sh.tpl" . | include "5g-control-plane.template" | indent 4 }}
{{- if not .Values.config.useExistingConfigMap -}}
{{- range $key, $value := .Values.config.smf.cfgFiles }}
  {{ $key }}: |-
{{ toYaml $value | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
