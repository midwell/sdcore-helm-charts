# SPDX-License-Identifier: Apache-2.0
*/}}

{{- if .Values.config.amf.deploy }}

{{- if not .Values.config.useExistingConfigMap -}}
{{- $amfcfg := index .Values.config.amf.cfgFiles "amfcfg.yaml" }}
{{- $sbi := index $amfcfg.configuration "sbi" }}

{{- if not (hasKey $sbi "port") -}}
{{- $_ := .Values.config.amf.sbi.port | set $sbi "port" -}}
{{- end }}

{{- if not (hasKey $amfcfg.configuration "ngappPort") -}}
{{- $_ := .Values.config.amf.ngapp.port | set $amfcfg.configuration "ngappPort" -}}
{{- end }}

{{- if not (hasKey $amfcfg.configuration "sctpGrpcPort") -}}
{{- $_ := .Values.config.amf.sctp_grpc.port | set $amfcfg.configuration "sctpGrpcPort" -}}
{{- end }}

{{- if not (hasKey $amfcfg.configuration "mongodb") -}}
{{- $_ := dict "name" .Values.config.mongodb.name "url" .Values.config.mongodb.url | set $amfcfg.configuration "mongodb" -}}
{{- end }}

{{/*
Refuse an unusable Lawful Interception timer before anything is deployed. See
_li-duration.tpl for why this belongs here as well as in the element.

Gated on li.enabled, because a value that is not read cannot be wrong: a deployment with
interception off and a stale timer left in its values must not be refused for a setting
that reaches no element.
*/}}
{{- if .Values.config.amf.li.enabled -}}
{{- range $key, $value := dict
      "keepaliveTimeout" .Values.config.amf.li.keepaliveTimeout
      "x2x3KeepaliveTimeP1" .Values.config.amf.li.x2x3KeepaliveTimeP1
      "x2x3KeepaliveTimeP2" .Values.config.amf.li.x2x3KeepaliveTimeP2 -}}
{{- include "5g-control-plane.li.checkDuration" (dict "value" $value "key" (printf "config.amf.li.%s" $key)) -}}
{{- end -}}
{{- end }}

{{/*
Lawful Interception. The credential paths follow the Secret mounted at certDir by
the deployment, and x1Listen matches the port the X1 Service exposes, so enabling
LI needs no second place to keep in step. Optional fields are set only when
configured: an empty admfUrl leaves NE-initiated fault reporting off, and an empty
admfId accepts any correctly-bound ADMF rather than a named one.

"Configured" is `or (kindIs "bool" $v) $v` rather than plain `$v`, because the last
two keys are booleans and `if $v` is false for `false` — an operator withholding
permission for a bulk operation would have had the key silently dropped, leaving the
element performing it. For every string key the two tests agree: an unset string is
empty, which is falsey and not of kind bool, so nothing already here moves.
*/}}
{{- if and .Values.config.amf.li.enabled (not (hasKey $amfcfg.configuration "li")) -}}
{{- $li := dict
      "x1Listen" (printf ":%v" .Values.config.amf.li.x1.port)
      "neId" .Values.config.amf.li.neId
      "cert" (printf "%s/tls.crt" .Values.config.amf.li.certDir)
      "key" (printf "%s/tls.key" .Values.config.amf.li.certDir)
      "caCert" (printf "%s/ca.crt" .Values.config.amf.li.certDir) -}}
{{- range $k, $v := dict "mdf2" .Values.config.amf.li.mdf2 "admfUrl" .Values.config.amf.li.admfUrl "admfId" .Values.config.amf.li.admfId "keepaliveTimeout" .Values.config.amf.li.keepaliveTimeout "x2x3KeepaliveTimeP1" .Values.config.amf.li.x2x3KeepaliveTimeP1 "x2x3KeepaliveTimeP2" .Values.config.amf.li.x2x3KeepaliveTimeP2 -}}
{{- if or (kindIs "bool" $v) $v -}}{{- $_ := $v | set $li $k -}}{{- end -}}
{{- end -}}
{{/*
The three tri-state booleans are handled apart from the sweep above, because for them
the operator's *spelling* has to be checked rather than only their presence. See
_li-tristate.tpl: an empty-string default invites a quoted replacement, a quoted
boolean is a YAML string, and a YAML string where the element declares a *bool fails
the whole configuration load — the network function crashlooping over a lawful
interception key, which is the one cost an LI mistake may never have.
*/}}
{{- range $k, $v := dict "x2x3KeepaliveEnabled" .Values.config.amf.li.x2x3KeepaliveEnabled "deactivateAllTasks" .Values.config.amf.li.deactivateAllTasks "removeAllDestinations" .Values.config.amf.li.removeAllDestinations -}}
{{- $b := include "5g-control-plane.li.triStateBool" (dict "value" $v "key" (printf "config.amf.li.%s" $k)) -}}
{{- if eq $b "true" -}}{{- $_ := set $li $k true -}}{{- end -}}
{{- if eq $b "false" -}}{{- $_ := set $li $k false -}}{{- end -}}
{{- end -}}
{{/*
Pre-shared delivery destinations, if any. A task naming one of these DIDs is delivered to
it exactly as if the ADMF had provisioned it with CreateDestination — which is a supported
arrangement, not a fallback: neither TS 103 221-1 nor TS 33.128 requires that a task's
destination identifier arrived over X1 rather than having been agreed. A destination
provisioned over X1 under the same DID takes precedence, and the element reports which is
in force. `mdf2` above remains the default for a task that names nothing resolvable.
*/}}
{{- if .Values.config.amf.li.destinations -}}
{{- $_ := .Values.config.amf.li.destinations | set $li "destinations" -}}
{{- end -}}
{{- $_ := $li | set $amfcfg.configuration "li" -}}
{{- end }}

{{- if not (hasKey $amfcfg "logger") -}}
{{- $_ := .Values.config.logger | set $amfcfg "logger" -}}
{{- end }}

{{- if not (hasKey $amfcfg.configuration "enableSctpLb") -}}
{{- $_ := .Values.config.sctplb.deploy | set $amfcfg.configuration "enableSctpLb" -}}
{{- end }}

{{- if not (hasKey $amfcfg.configuration.kafkaInfo "enableKafka") -}}
{{- $_ := .Values.kafka.deploy | set $amfcfg.configuration.kafkaInfo "enableKafka" -}}
{{- end }}

{{- end }}


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amf
  labels:
{{ tuple "amf" . | include "5g-control-plane.metadata_labels" | indent 4 }}
data:
  amf-run.sh: |
{{ tuple "bin/_amf-run.sh.tpl" . | include "5g-control-plane.template" | indent 4 }}
{{- if not .Values.config.useExistingConfigMap -}}
{{- range $key, $value := .Values.config.amf.cfgFiles }}
  {{ $key }}: |-
{{ toYaml $value | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
