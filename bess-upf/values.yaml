images:
  repository: "ghcr.io/omec-project/" # default GitHub Registry
  tags:
    bess: upf-bess:rel-2.5.0
    pfcp: upf-pfcp:rel-2.5.0
    sriov: aether-cni:rel-1.4.0
    tools: pod-init:rel-1.3.0
  pullPolicy: IfNotPresent

nodeSelectors:
  enabled: false
  label: node-role.aetherproject.org/upf
  value: true

resources:
  enabled: true
  bess:
    requests:
      cpu: 2
      memory: 2Gi
    limits:
      cpu: 2
      memory: 2Gi
  routectl:
    requests:
      cpu: 256m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 128Mi
  web:
    requests:
      cpu: 256m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 128Mi
  cpiface:
    requests:
      cpu: 256m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 128Mi

config:
  coreDump:
    enabled: false
    path: /tmp/coredump
  # PFCP raw dump configuration
  upfDump:
    # Enable raw PFCP dump-to-disk for debugging parse errors. When enabled
    # the `pfcp-agent` container will receive environment variables to
    # control where dumps are written and how pruning is performed.
    # Recommended defaults:
    #  - For a single-node/test environment: keep persistence.enabled=false
    #    (uses emptyDir), set maxBytes to limit total storage (default 100MiB)
    #  - For production or long-term capture, enable persistence.enabled=true
    #    and configure a PVC with an appropriate size (size & storageClass).
    enabled: false
    dir: /var/log/upf/pfcp_dumps
    upfName: ""
    maxBytes: 104857600 # 100 MiB
    maxFiles: 1000
    toLog: false
    persistence:
      # When true, the chart will create a PVC for the dump storage
      enabled: false
      size: 5Gi
      storageClass: ""
  gratuitousArp:
    enabled: true
    interval: 10 # seconds
  upf:
    # Enable privileged when run from VM with sriov support
    privileged: false
    prometheus:
      port: 8080
      # Provide nodePort when serviceType is NodePort
      #nodePort: 30088
    hugepage:
      enabled: true
    sriov:
      enabled: true
    # Dynamic IP allocation is not supported yet
    # Custom routes inside UPF
    #routes:
    #  - to: 10.76.28.173/32
    #    via: 169.254.1.1
    enb:
      subnet: 192.168.251.0/24
    access:
      ipam: static
      cniPlugin: vfioveth
      # Provide sriov resource name when sriov is enabled
      resourceName: "intel.com/intel_sriov_vfio"
      gateway: 192.168.252.1
      ip: 192.168.252.3/24
      #mac:
      #vlan:
      #iface:
    core:
      ipam: static
      cniPlugin: vfioveth
      # Provide sriov resource name when sriov is enabled
      resourceName: "intel.com/intel_sriov_vfio"
      gateway: 192.168.250.1
      ip: 192.168.250.3/24
      #mac:
      #vlan:
      #iface:
    closedLoop: false
    closedLoopPort: 9301
    cfgFiles:
      upf.jsonc:
        mode: dpdk
        log_level: "info"
        workers: 1
        max_sessions: 50000
        table_sizes:
          pdrLookup: 50000
          appQERLookup: 200000
          sessionQERLookup: 100000
          farLookup: 150000
        access:
          ifname: access
        core:
          ifname: core
        measure_upf: true
        measure_flow: false
        enable_notify_bess: true
        notify_sockaddr: "/pod-share/notifycp"
        cpiface:
          hostname: "upf"
          http_port: "8080"
        # Default global rate limits. Can be changed at runtime via BESS gRPC.
        slice_rate_limit_config:
          # Uplink
          n6_bps: 1000000000 # 1Gbps
          n6_burst_bytes: 12500000 # 10ms * 1Gbps
          # Downlink
          n3_bps: 1000000000 # 1Gbps
          n3_burst_bytes: 12500000 # 10ms * 1Gbps
        qci_qos_config:
          - qci: 0 # Fallback QCI
            cbs: 50000
            ebs: 50000
            pbs: 50000
            burst_duration_ms: 10
            priority: 7
    # Lawful Interception credentials. LI is off unless an "li" block is present
    # in the upf.jsonc config; these only say where the X0-pre-provisioned
    # credentials come from. They live in a Secret created out of band, so the
    # private key never enters chart values, Helm state, or git.
    #
    # That upf.jsonc "li" block also takes the two bulk operations ETSI TS 103 221-1
    # leaves to advance agreement rather than settling itself.
    #
    # **This chart already sets deactivate_all_tasks: false for you** when the li block
    # is present and you have not set it — see templates/configmap-upf.yaml for why.
    # It is in the rendered ConfigMap, not here, because there is no li block to default
    # it into until you add one. Set it explicitly to override, in either direction:
    #
    #   deactivate_all_tasks: true    # a triggering function that does send bulk messages
    #
    # remove_all_destinations needs nothing: unset already means refused, which is what
    # the recommendation asks for, so setting it false would change no behaviour.
    #
    # It also takes the X2/X3 keepalive of ETSI TS 103 221-2 clause 6.2.4, which proves
    # the mediation function receiving X3 is still running: the shipper sends a
    # Keepalive every TIME_P1 and disconnects, reconnects and reports a fault if
    # nothing acknowledges within TIME_P2. Omitted, they give the specification's own
    # behaviour — enabled, 60 s and 180 s — which is what a deployment should ship
    # with. Unlike the control plane, this element refuses an unusable pair outright
    # rather than falling back, so TIME_P2 must exceed TIME_P1 or the UPF will not
    # start.
    #
    #   x2x3_keepalive_enabled: false   # only for an MDF that never acknowledges
    #   x2x3_keepalive_time_p1: "60s"
    #   x2x3_keepalive_time_p2: "180s"
    #
    # Setting enabled to false is for a mediation function that does not implement the
    # MDF half of the clause: it would otherwise be disconnected every TIME_P2, losing
    # whatever was in flight each time. The sipgate reference simulator this project
    # interoperates with is one — probed 2026-08-14, it answers no Keepalive at all.
    li:
      certSecret: upf-li-certs
      certDir: /etc/li/certs
      x1:
        # The port the UPF's LI_T3 triggering interface listens on. It must match
        # the "x1_listen" port in the upf.jsonc li block below.
        port: 8443
        # Name of the Service that fronts it. The SMF dials the host in its
        # configured x1Url and TLS name verification happens before any identity
        # check, so this must be a name the UPF's LI certificate covers.
        serviceName: upf-x1
        # Withdrawn. It rendered a NetworkPolicy that admitted X1 and, by the
        # isolation such a policy implies, denied N4/PFCP as well — stopping the
        # user plane. Setting it now fails the render rather than deploying that.
        # See templates/service-x1.yaml for what to do instead.
        allowedSources: []
        # serviceAnnotations: {}

service:
  type: ClusterIP
  #externalIp:
  #annotations:

servicemonitor:
  enabled: false
