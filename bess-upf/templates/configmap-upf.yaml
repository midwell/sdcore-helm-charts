---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upf
  labels:
{{ tuple "upf" . | include "omec-user-plane.metadata_labels" | indent 4 }}
data:
{{- range $key, $value := .Values.config.upf.cfgFiles }}
{{- if and (eq $key "upf.jsonc") (hasKey $value "li") }}
  {{ $key }}: {{ toJson (mustMergeOverwrite (omit (deepCopy $value) "li") (dict "li" $liOut)) | quote }}
{{- else }}
  {{ $key }}: {{ toJson $value | quote }}
{{- end }}
{{- end }}
  bessd-start.sh: |
{{ tuple "bin/_bessd-start.sh.tpl" . | include "omec-user-plane.template" | indent 4 }}
  bessd-poststart.sh: |
{{ tuple "bin/_bessd-poststart.sh.tpl" . | include "omec-user-plane.template" | indent 4 }}
