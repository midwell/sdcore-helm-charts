{{/*
# SPDX-FileCopyrightText: 2026 Forsway Scandinavia AB
# SPDX-License-Identifier: Apache-2.0

The UPF is a triggered Content-of-Communication POI: the SMF's triggering function
tasks it over X1 (LI_T3), telling it which warrant each duplicated packet belongs
to. That interface therefore has to be reachable, and this Service is what makes it
so.

Unlike the AMF's and SMF's X1 Services, this one is reached from *inside* the
cluster — the peer is the SMF, not the external ADMF — so a ClusterIP suffices and
nothing needs to be exposed beyond the cluster boundary.

It must remain a plain Service. An ingress or any proxy that terminates TLS strips
the triggering function's client certificate, and the identity binding that stops a
certificate from one element tasking another (ETSI TS 103 221-1 clause 8.2.4) then
has nothing to check.

The Service name matters: the SMF dials the host in its configured x1Url, and TLS
name verification happens before any identity check, so that host must be covered
by this UPF's LI certificate. Set config.upf.li.x1.serviceName to whichever name
the certificate carries — and to whichever name the SMF dials, which by default is
the "upf-1" in 5g-control-plane's upfTriggers[].x1Url. The two charts install
separately, so nothing here can check that; a disagreement renders perfectly and
leaves a triggering function that can never reach its POI.

Rendered only when the UPF's own configuration contains an "li" block, so a
deployment without Lawful Interception produces no such object.
*/}}
{{- $upfConfig := index .Values.config.upf.cfgFiles "upf.jsonc" }}
{{- if hasKey $upfConfig "li" }}
{{- $li := index $upfConfig "li" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.upf.li.x1.serviceName | default "upf-1" }}
  labels:
{{ tuple "upf" . | include "omec-user-plane.metadata_labels" | indent 4 }}
{{- with .Values.config.upf.li.x1.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  type: ClusterIP
  selector:
{{ tuple "upf" . | include "omec-user-plane.metadata_labels" | indent 4 }}
  ports:
  - name: x1
    protocol: TCP
    port: {{ .Values.config.upf.li.x1.port | default 8443 }}
    targetPort: {{ .Values.config.upf.li.x1.port | default 8443 }}
{{- if .Values.config.upf.li.x1.allowedSources }}
{{- fail "config.upf.li.x1.allowedSources is no longer supported: a pod-level NetworkPolicy admitting only X1 also denies N4/PFCP, which stops the user plane. See the note in templates/service-x1.yaml." }}
{{- end }}
{{- end }}

{{/*
Deliberately no NetworkPolicy, and allowedSources refuses to render rather than
being quietly ignored.

An earlier version of this chart offered one, and it would have taken the user
plane down. A NetworkPolicy that selects a pod isolates it for every listed
policyType, so an Ingress policy admitting only X1 denies everything else that
arrives on the pod's primary interface — including PFCP from the SMF, which
reaches this pod through the "upf" ClusterIP Service on 8805/UDP. GTP-U would
have survived, since it arrives over the Multus access/core attachments the CNI's
policy engine does not govern, which is precisely what would have made the
failure confusing: the datapath still up, sessions unable to be established.

The exposure this was meant to mitigate is small to begin with. This Service is
ClusterIP: the port is not reachable from outside the cluster at all, so the peer
would have to be a workload already running inside it. Such a peer still gets
nowhere without a certificate from the LI CA carrying the triggering function's
identifier bound into it (TS 103 221-1 clause 8.2.4), and a peer that has one is
past what any address filter would have decided.

To restrict it further, do it where the rule cannot sever unrelated traffic: a
CNI-level policy that names the ports this pod must keep accepting (8805/UDP from
the SMF and whatever scrapes its metrics), maintained with the deployment rather
than the chart.
*/}}
